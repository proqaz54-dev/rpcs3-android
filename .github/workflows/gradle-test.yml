name: Gradle-only test (fast)

on:
  workflow_dispatch:

env:
  NDK_VERSION: "28.2.13676358"
  BUILD_TOOLS_VERSION: "35.0.0"
  PLATFORM_VERSION: "android-35"

jobs:
  gradle-check:
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Find latest run with core libs artifact
        id: find-run
        run: |
          RUN_ID=""
          for page in 1 2 3 4 5; do
            IDS=$(gh api "repos/${{ github.repository }}/actions/workflows/build-apk.yml/runs?per_page=20&page=$page" \
              --jq '[.workflow_runs[] | select(.status == "completed") | .id] | join(" ")')
            for ID in $IDS; do
              COUNT=$(gh api "repos/${{ github.repository }}/actions/runs/$ID/artifacts" \
                --jq '[.artifacts[] | select(.name == "rpcs3-core-libs")] | length')
              if [ "$COUNT" -gt 0 ]; then
                RUN_ID=$ID
                break
              fi
            done
            [ -n "$RUN_ID" ] && break
          done
          if [ -z "$RUN_ID" ]; then
            echo "No core libs artifact found. Run the main workflow first." >&2
            exit 1
          fi
          echo "Using core artifact from run $RUN_ID"
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and build tools
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}" "build-tools;${BUILD_TOOLS_VERSION}" "platforms;${PLATFORM_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Download core libs from latest run with artifact
        run: |
          ART_ID=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.name == "rpcs3-core-libs")][0].id')
          mkdir -p build-android
          gh api "repos/${{ github.repository }}/actions/artifacts/$ART_ID/zip" > core-libs.zip
          unzip -q -o core-libs.zip -d build-android
          rm core-libs.zip
          ls -la build-android/rpcs3/Emu/librpcs3_emu.a
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ env.RUN_ID }}

      - name: Build JNI library and assemble APK
        run: |
          cd android
          ../gradlew assembleDebug
        env:
          RPCS3_BUILD_DIR: ${{ github.workspace }}/build-android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpcs3-android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error