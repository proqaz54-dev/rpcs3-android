name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  NDK_VERSION: "28.2.13676358"
  BUILD_TOOLS_VERSION: "35.0.0"
  PLATFORM_VERSION: "android-35"

jobs:
  build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and build tools
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}" "build-tools;${BUILD_TOOLS_VERSION}" "platforms;${PLATFORM_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install CMake, Ninja and ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ccache
          echo "CMAKE=$(which cmake)" >> "$GITHUB_ENV"

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('3rdparty/**/*.cpp', '3rdparty/**/*.h', 'rpcs3/**/*.cpp', 'rpcs3/**/*.h') }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Configure ccache
        run: |
          ccache --set-config=cache_dir=~/.ccache
          ccache --set-config=max_size=3G
          ccache --set-config=compression=true

      - name: Cache LLVM build
        uses: actions/cache@v4
        with:
          path: build-android/3rdparty/llvm
          key: llvm-${{ runner.os }}-${{ hashFiles('3rdparty/llvm/**') }}
          restore-keys: |
            llvm-${{ runner.os }}-

      - name: Build emulator core (rpcs3_emu static lib)
        run: |
          export CCACHE_CPP2=yes
          cmake -S . -B build-android \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake" \
            -DANDROID_PLATFORM=android-29 \
            -DANDROID_ABI=arm64-v8a \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_LLVM=ON \
            -DUSE_SYSTEM_CURL=OFF \
            -DUSE_FAUDIO=OFF \
            -DUSE_SYSTEM_SDL=OFF
          cmake --build build-android -j$(nproc) --target rpcs3_emu

      - name: Build JNI library and assemble APK
        run: |
          cd android
          ../gradlew assembleDebug
        env:
          RPCS3_BUILD_DIR: ${{ github.workspace }}/build-android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpcs3-android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error